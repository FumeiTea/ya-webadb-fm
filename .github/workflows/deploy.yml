name: Deploy to gh-pages branch

on:
  push:
    branches:
      - main  # 如果你的默认主分支是 master，请把这里改成 master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install pnpm
        run: npm install -g pnpm

      - name: 4. Install dependencies
        run: pnpm install

      - name: 5. 编译底层核心库
        # 这一步负责把那 25 个依赖包编译完
        run: pnpm run build

      - name: 6. 强行编译 Web 前端
        # 潜入网页目录，拿枪指着它单独编译
        run: |
          cd apps/web
          pnpm run build

      - name: 7. 动态捕获产物路径 (终极防线)
        # 用一段 Bash 脚本自动寻找打包好的文件夹，并传给下一步
        run: |
          cd apps/web
          if [ -d "dist" ]; then
            echo "✅ 锁定目标: dist"
            echo "DEPLOY_DIR=apps/web/dist" >> $GITHUB_ENV
          elif [ -d "out" ]; then
            echo "✅ 锁定目标: out"
            echo "DEPLOY_DIR=apps/web/out" >> $GITHUB_ENV
          elif [ -d "build" ]; then
            echo "✅ 锁定目标: build"
            echo "DEPLOY_DIR=apps/web/build" >> $GITHUB_ENV
          else
            echo "❌ 见鬼了，根本没有生成任何网页文件！"
            ls -la
            exit 1
          fi

      - name: 8. Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ env.DEPLOY_DIR }}  # 自动使用上一步找到的正确路径
